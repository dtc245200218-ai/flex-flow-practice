<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Flex Flow Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Thực hành CSS Flex-flow</h1>

    <section>
      <h2>Ví dụ 1: row nowrap</h2>
      <p>Các item nằm trên một hàng theo thứ tự từ trái sang phải.</p>

      <div class="container container-1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
      </div>
    </section>

    <section>
      <h2>Ví dụ 2: row-reverse nowrap</h2>
      <p>Các item nằm trên một hàng theo hướng ngược lại.</p>

      <div class="container container-2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
      </div>
    </section>
  </body>
</html>
